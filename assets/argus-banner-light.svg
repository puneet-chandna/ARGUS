<rect class="cp" x="1040" y="120" width="40" height="40" fill="#F8E9D1" fill-opacity="1" stroke="#B68106" stroke-width="1.5"/>
<path class="b br" d="M1034 123 V114 H1043 M1077 114 H1086 V123 M1086 157 V166 H1077 M1043 166 H1034 V157" fill="none" stroke="#B68106" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(86 56) scale(.84375)">
<rect x="1" y="1" width="254" height="254" rx="56" fill="#08242B" stroke="#08242B" stroke-width="2"/>
<path class="a" pathLength="100" d="M64 200 L128 58 L192 200" fill="none" stroke="#F4F1E8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<g class="b e"><path d="M104 152 Q128 130 152 152 Q128 174 104 152Z" fill="#F2B544"/><circle class="p" cx="128" cy="152" r="7" fill="#08242B"/></g>
<g class="bars" fill="#1FA8A0"><rect x="64" y="214" width="34" height="9" rx="4.5" style="animation-delay:0s"/><rect x="111" y="214" width="34" height="9" rx="4.5" style="animation-delay:.4s"/><rect x="158" y="214" width="34" height="9" rx="4.5" style="animation-delay:.8s"/></g>
</g>
<g font-family="Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<text x="372" y="158" font-size="96" font-weight="800" letter-spacing="8" fill="#08242B">ARGUS</text>
<text x="376" y="196" font-size="19" font-weight="600" letter-spacing="3.2" fill="#0F5C6E">AUDITABLE RATE GRID UNDERSTANDING SYSTEM</text>
<text x="376" y="248" font-size="27" font-weight="500" fill="#08242B" fill-opacity=".85">Reads the policy. Finds the rate. Shows the cell.</text>
<rect x="376" y="262" width="56" height="4" rx="2" fill="#F2B544"/>
</g>
