<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Argus. Auditable Rate Grid Understanding System. Reads the policy. Finds the rate. Shows the cell." xmlns:c2pa="http://c2pa.org/manifest">
<style>
.b{transform-box:fill-box;transform-origin:center}
@keyframes draw{0%{stroke-dashoffset:100;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}12%{stroke-dashoffset:0}92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes eye{0%,9%{transform:scaleY(0);opacity:1;animation-timing-function:cubic-bezier(.2,.9,.3,1.2)}15%{transform:scaleY(1)}63%{transform:scaleY(1)}65%{transform:scaleY(.08)}67.5%{transform:scaleY(1)}92%{transform:scaleY(1);opacity:1}98%,100%{transform:scaleY(1);opacity:0}}
@keyframes glance{0%,26%{transform:translateX(0)}32%,38%{transform:translateX(-5px)}44%,50%{transform:translateX(5px)}56%,100%{transform:translateX(0)}}
@keyframes barsfade{0%,12%{opacity:0}17%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes load{0%,100%{opacity:.25}20%,40%{opacity:1}}
@keyframes lock{0%,30%{transform:scale(1.9);opacity:0}40%{transform:scale(1);opacity:1}85%{transform:scale(1);opacity:1}95%,100%{transform:scale(1.15);opacity:0}}
@keyframes cellpulse{0%,100%{opacity:.55}50%{opacity:1}}
.a{stroke-dasharray:100;animation:draw 9s infinite}
.e{animation:eye 9s infinite}
.p{animation:glance 9s infinite}
.bars{animation:barsfade 9s infinite}
.bars rect{animation:load 2.4s infinite}
.br{animation:lock 9s infinite}
.cp{animation:cellpulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a{stroke-dashoffset:0}}
</style>
<defs><clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="1200" height="320" fill="#F4F1E8"/>
