name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          npm ci
      - name: Verify the original starter files
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            https://solvetojoin.vaatun.com/downloads/insurance-rater-agent-challenge.zip \
            --output "$RUNNER_TEMP/vaatun.zip"
          unzip -n -q "$RUNNER_TEMP/vaatun.zip" -d vaatun-starter-bundle
          npm run verify:corpus
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v3
        with:
          version: 2.90.0
      - name: Run storage and browser tests with local Supabase
        run: |
          supabase_dir="$RUNNER_TEMP/argus-supabase"
          mkdir -p "$supabase_dir"
          supabase --workdir "$supabase_dir" init
          cp -r supabase/migrations "$supabase_dir/supabase/"
          supabase --workdir "$supabase_dir" start
          supabase --workdir "$supabase_dir" status --output env > "$RUNNER_TEMP/supabase.env"
          source "$RUNNER_TEMP/supabase.env"
          export SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY"
          export ARGUS_PUBLIC_ORIGIN=http://127.0.0.1:3361
          export ARGUS_TEST_URL="$ARGUS_PUBLIC_ORIGIN" ARGUS_TEST_SUPABASE_URL="$SUPABASE_URL" ARGUS_TEST_SUPABASE_SECRET="$SUPABASE_SECRET_KEY"
          export ARGUS_TEST_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          npm run test:coverage
